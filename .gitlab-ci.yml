include:
  - project: workloads/ci-template
    ref: master
    file: /gitlab-ci.v4.1.yaml

variables:
  NO_SCAN_FILES: ".gitignore|coverage|node_modules|dist"
  IMAGE_REPOSITORY: registry.tekoapis.com/teko-registry/nio/wc2026-prediction
  DOCKER_BUILD_OPTS: "-f ./docker/Dockerfile"

.bun_setup:
  image: oven/bun:1.3.14-alpine
  cache:
    key: bun-lock
    paths:
      - node_modules/
      - .bun/
  before_script:
    - bun install --frozen-lockfile

test:build:
  extends: .bun_setup
  stage: pretest
  script:
    - bun run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE =~ /web|push/ && $CI_COMMIT_REF_NAME =~ /master|main/ && $CI_COMMIT_MESSAGE !~ /^Merge branch.*/
  tags:
    - ci-builder-k8s

test:lint:
  extends: .bun_setup
  stage: pretest
  script:
    - bun run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE =~ /web|push/ && $CI_COMMIT_REF_NAME =~ /master|main/ && $CI_COMMIT_MESSAGE !~ /^Merge branch.*/
  tags:
    - ci-builder-k8s

test:validate-mr:
  stage: pretest
  rules:
    - when: never
